#A configuration file for TOX.
#tox is a test framework that will be used to run sanity tests on your repo.
#In the Samle repo the tests ammount to succesful slash list tests command.

[tox]
envlist =
    py{37}-windows
    py{3}-linux
    flake8
    pylint
skipsdist = True


[testenv]
skip_install = true
# environment will be skipped if regular expression does not match against the sys.platform string
platform=
       linux: linux
       windows: win32
passenv = APPDATA
setenv =
    CAN_INTERFACE = virtual
    CAN_CHANNEL = vcan0
deps=
    -r{toxinidir}/requirements.txt
commands=
    slash list tests

[testenv:py2]
skip_install = true
# environment will be skipped if regular expression does not match against the sys.platform string
platform=
       linux: linux
       windows: win32
passenv = APPDATA
setenv =
    CAN_INTERFACE = virtual
    CAN_CHANNEL = vcan0
deps=
    -r{toxinidir}/requirements.txt
commands=
    - slash list tests

# Linters
[testenv:flake8]
skip_install = true
deps =
    flake8
    pep8-naming
commands =
    flake8 {posargs:tests}

[testenv:pylint]
skip_install = true
deps =
    pyflakes
    pylint
    -r{toxinidir}/requirements.txt
commands =
    pylint {posargs:--errors-only} tests

# Flake8 Configuration
[flake8]
exclude =
    .tox,
    .git,
    __pycache__,
    docs/source/conf.py,
    build,
    dist,
    tests/fixtures/*,
    *.pyc,
    *.egg-info,
    .cache,
    .eggs,
    *_pb2.py
max-complexity = 10
max-line-length = 120
